services:
  syncguard-hub:
    build:
      context: ../..
      dockerfile: docker/hub/Dockerfile
    restart: unless-stopped
    ports:
      - "7443:7443"
    environment:
      PORT: "7443"
      HUB_PORT: "7443"
      HUB_DATA_DIR: /data
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:?set HUB_ADMIN_TOKEN}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
    volumes:
      - syncguard_hub_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7443/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  syncguard_hub_data:
